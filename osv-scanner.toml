# Time-boxed ignores for advisories that cannot be fixed from this repo.
#
# Add an entry only when no fixed release exists. Give every entry an
# `ignoreUntil` date so the scan fails again if nobody revisits it, and a
# comment explaining why the advisory doesn't apply here.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = "..."
