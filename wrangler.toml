# Cloudflare Workers, not Pages.
#
# @astrojs/cloudflare v11 was the last release that supported Pages;
# v12 onward targets Workers with static assets. Since the /_image SSRF
# advisory is only fixed in v12.6.6+, and the astro advisories need
# astro >= 6.4.6 which requires adapter v13+, there is no version
# combination that clears the audit and stays on Pages.
name = "website-astro-software"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_als"]

# The adapter generates the worker entry and its assets binding at
# build time; declaring `main` here would be validated before the
# build has produced it.
[assets]
directory = "./dist"

[vars]
PUBLIC_API_URL = "https://api.kaianolevine.com"
PUBLIC_SITE_URL = "https://software.kaianolevine.com"
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAACXUS6RYhJCvPzZg"
